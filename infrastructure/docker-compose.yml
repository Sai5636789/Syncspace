name: syncspace

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncspace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-syncspace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncspace} -d ${POSTGRES_DB:-syncspace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: syncspace-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-syncspace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-syncspace}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-syncspace_dev_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      COLLAB_SERVER_URL: http://collaboration-server:3001
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collaboration-server:
    build:
      context: ../collaboration-server
      dockerfile: Dockerfile
    container_name: syncspace-collab
    environment:
      COLLAB_PORT: 3001
      BACKEND_URL: http://backend:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgres://${POSTGRES_USER:-syncspace}:${POSTGRES_PASSWORD:-syncspace_dev_password}@postgres:5432/${POSTGRES_DB:-syncspace}
    ports:
      - "${COLLAB_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: syncspace-frontend
    environment:
      API_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: syncspace-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      collaboration-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
