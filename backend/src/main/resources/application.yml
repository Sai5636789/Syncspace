spring:
  application:
    name: syncspace-backend
  datasource:
    # [::1]: this VM intercepts Java TCP to 127.0.0.1 (sandbox egress
    # redirect) — IPv6 loopback reaches the real local Postgres. Docker
    # overrides the URL via SPRING_DATASOURCE_URL, so this is local-only.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://[::1]:5432/syncspace?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:syncspace}
    password: ${SPRING_DATASOURCE_PASSWORD:syncspace_dev_password}
  # Redis is transport only (Pub/Sub fan-out, presence, cache) — never the
  # durable store. Default host ::1: this VM intercepts Java TCP to
  # 127.0.0.1 (sandbox egress redirect); IPv6 loopback reaches the real
  # local Redis. Docker Compose overrides via SPRING_REDIS_HOST=redis.
  data:
    redis:
      host: ${SPRING_REDIS_HOST:::1}
      port: ${SPRING_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

syncspace:
  jwt:
    # Override with JWT_SECRET in any shared environment. At least 32 chars.
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  invitations:
    default-expiry-hours: 72
