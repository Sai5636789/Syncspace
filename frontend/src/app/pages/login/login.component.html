<div class="page-center">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Log in to SyncSpace</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" required />
          @if (form.controls.email.hasError('email')) {
            <mat-error>Enter a valid email address</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" required />
        </mat-form-field>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="submitting()">
          {{ submitting() ? 'Logging in…' : 'Log in' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <span>New to SyncSpace?</span>
      <a mat-button routerLink="/register">Create an account</a>
    </mat-card-actions>
  </mat-card>
</div>
